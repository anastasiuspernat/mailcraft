name: Relay

# MailCraft relay (apps/mailcraft-relay) for Windows: the owner's own push relay for MailCraft on
# iPad, built as two programs (`mailcraft-relay.exe`, which sets it up, and
# `mailcraft-relay-service.exe`, which runs it without a window) and handed on as one zip. Nothing
# here is signed; the one secret is Google's OAuth client, which the relay signs in with.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mailcraft-relay/**'
      - 'crates/net/**'
      - 'crates/proto/**'
      - 'crates/model/**'
      - '.github/workflows/relay.yml'

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build the relay for Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - name: Test the relay
        run: cargo test --locked -p mailcraft-relay
      - name: Build the relay
        env:
          # Google's sign-in page: the project's own OAuth client (Google calls a desktop client's
          # secret not confidential; it is kept as a repository secret all the same).
          MAILCRAFT_GOOGLE_CLIENT_ID: ${{ secrets.MAILCRAFT_GOOGLE_CLIENT_ID }}
          MAILCRAFT_GOOGLE_CLIENT_SECRET: ${{ secrets.MAILCRAFT_GOOGLE_CLIENT_SECRET }}
        run: cargo build --locked --release -p mailcraft-relay
      - name: Pack it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force relay | Out-Null
          Copy-Item target/release/mailcraft-relay.exe, target/release/mailcraft-relay-service.exe, docs/push-relay.md relay/
          & relay/mailcraft-relay.exe help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailcraft-relay-windows-x64
          path: relay/
          if-no-files-found: error
          retention-days: 30
