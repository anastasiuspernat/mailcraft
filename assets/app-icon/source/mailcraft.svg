<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 206">
  <!-- Harbor: three envelopes stacked on a rounded tile, blue from cyan at its top. Units: the tile
       is 206 (an 824 px body on Apple's 1024 grid, at a quarter). -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="57.8" y1="-21.1" x2="148.2" y2="227.1">
      <stop offset="0" stop-color="#00bfff"/><stop offset="1" stop-color="#0042d0"/>
    </linearGradient>
    <clipPath id="body"><rect width="206" height="206" rx="46"/></clipPath>
    <clipPath id="front"><rect x="35" y="78" width="136" height="90" rx="14"/></clipPath>
    <mask id="edge" maskUnits="userSpaceOnUse" x="0" y="0" width="206" height="206">
      <rect width="206" height="206" rx="46" fill="#ffffff"/>
      <rect y="1" width="206" height="206" rx="46" fill="#000000"/>
    </mask>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#003c3c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="206" height="206" rx="46" fill="url(#tile)"/>
  <g clip-path="url(#body)">
    <!-- The light along the tile's top edge. -->
    <rect width="206" height="206" rx="46" fill="#ffffff" fill-opacity="0.35" mask="url(#edge)"/>
    <!-- The two envelopes behind, fainter the further back. -->
    <rect x="57" y="52" width="92" height="70" rx="12" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="46" y="64" width="114" height="80" rx="13" fill="#ffffff" fill-opacity="0.65"/>
    <!-- The envelope in front, and its flap as one bold V. -->
    <rect x="35" y="78" width="136" height="90" rx="14" fill="#ffffff" filter="url(#lift)"/>
    <path clip-path="url(#front)" fill="#0090f5" d="M35 78L103 128.4L171 78V92.4L103 142.8L35 92.4Z"/>
  </g>
</svg>
